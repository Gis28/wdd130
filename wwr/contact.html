<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact Us </title>
    <meta name="description"
      content="White water rafting is a type of recreation that involves navigating a non motorized watercraft down free flowing rivers.">
    <meta name="author" content="Gabriel Regis BONZO GOMA">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="rafting logo" width="120">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="information">
            <h1>Contact White Water Rafting</h1>
            <p> <strong></strong><br>123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@whitewater.com</p>
        </div>
        <div class="grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d854920.7273420304!2d-7.33943123522827!3d33.17385639106859!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sma!4v1771007617622!5m2!1sfr!2sma"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <section class="contact-form">
                <form action="information">
                    <div class="form-item column1">
                        <label for="name">Name </label>
                        <input type="text" id="name" name="name">
                    </div>
                    <div class="form-item column1">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <fieldset class="form-item">
                        <legend>Message Purpose</legend>
                        <label class="radio">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              required>General Inquiry</label>
                        <label class="radio">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation">Reservation Question</label>
                        <label class="radio">
                            <input type="radio" id="purpose-website" name="purpose"
                              value="website">Website Suggestion</label>
                    </fieldset>
                    <label for="message">message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="write your message">write your message</textarea>
                    <div class="subcribe">
                        <label><input type="checkbox" id="subcribe" name="subcribe"></label>
                        <label for="subcribe">Please Subscribe me to the monthly newsletter</label>
                        <button type="submit">Get in touch!</button>
                    </div>
                </form>
            </section>
        </div>
        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/brunel.jpg" alt="RH Profil picture" width="250">
                <figcaption>Brunel <strong>RH</strong></figcaption>
            </figure>

            <figure>
                <img src="images/gis.jpg" alt="CEO picture" width="205">
                <figcaption>Gabriel Regis <strong>CEO</strong></figcaption>
            </figure>

            <figure>
                <img src="images/christ.jpg" alt="Daf profil" width="167">
                <figcaption>Christevie <strong>DAF</strong></figcaption>
            </figure>

        </section>
    </main>
    <footer>
        <p>© 2026 | White Water Rafting | Gabriel Regis BONZO GOMA</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="50">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="50">
            </a>
        </nav>
    </footer>
</body>

</html>
