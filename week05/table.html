<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="table.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>team</th>
                <th>Record</th>
                <th>Player count</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2">southern</th>
                <td>parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td>catarina</td>
                <td>49-24</td>
                <td>10</td>
            </tr>
            <tr>
                <th rowspan="3">Western</th>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>
        <tfoot>
            <td colspan="3">Total players</td>
            <td>92</td>

        </tfoot>
    </table>
</body>

</html>
