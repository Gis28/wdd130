<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="stylesheet" href="poll-form.css">
</head>

<body>
    <main>

        <form>
            <h1>Contact information</h1>
            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>

            <div class="form-item colum1">
                <label for="quantity">What is your favorite browser?</label>
                <select name="quantity" id="quantity of browser">
                    <option value="Opera muni">Opera muni</option>
                    <option value="Chrome">Chrome</option>
                    <option value="Safari">Safari</option>
                    <option value="Edge">Edge</option>
                    <option value="Brave">Brave</option>
                </select>
            </div>
            <div class="Form-item colum1">
                <label for="pet">Do you have a household pet?</label>
                <label> <input type="checkbox" id="pet" name="pet"></label>
            </div>

            <label for="feedback">List the places you have lived :</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Congo, Senegal, DRC, Gabon"></textarea>

            <button type="submit">Submit poll</button>
        </form>
        </ul>
    </main>
</body>

</html>
